name: Wolfram CIEDE2000 Testing

on:
  workflow_dispatch:

env:
  n_csv_lines: 50000

jobs:
  test-implementation-de00-wl:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📂 For each step below, a new shell will be started at the repository root
        uses: actions/checkout@v7

      - name: 📦 Set up GCC
        run: |
          command -v gcc > /dev/null || { sudo apt-get update --allow-unauthenticated && sudo apt-get install --allow-unauthenticated --no-install-recommends --assume-yes gcc ; }

      - name: 🌐 Download the CIEDE2000 driver program
        run: wget --no-verbose --no-check-certificate --timeout=5 --tries=2 https://ciede2000.pages-perso.free.fr/static/github/ciede2000-native-precision-driver.c

      - name: ⚙️ Compile the CIEDE2000 driver program in C99
        run: gcc --version && gcc -std=c99 -Wall -pedantic -O2 -g ciede2000-native-precision-driver.c -o ciede2000-native -lm

      - name: 🎨 Generate ΔE2000 color difference test cases
        run: ./ciede2000-native --number $n_csv_lines --with-weights --output-file test-cases.csv

      - name: 🔧 Create Wolfram Language Driver
        run: |
          cat << 'EOF' > driver.wl
          
          Get["ciede2000.wl"];
          csvFiles = Select[$ScriptCommandLine, StringEndsQ[#, ".csv"] &];
          If[Length[csvFiles] < 2,
              Print["Usage: driver.wl <input.csv> <output.csv>"];
              Exit[1];
          ];
          inputFile = csvFiles[[1]];
          outputFile = csvFiles[[2]];
          canonicalMode = TrueQ[StringContainsQ[outputFile, "canonical", IgnoreCase -> True]];
          streamIn = OpenRead[inputFile];
          streamOut = OpenWrite[outputFile];
          line = ReadLine[streamIn];
          While[line =!= EndOfFile,
              nums = N[ToExpression[#]] & /@ StringSplit[StringReplace[line, {"e" -> "*10^", "E" -> "*10^"}], ","];
              If[Length[nums] == 9,
                  res = ciede2000[nums[[1]], nums[[2]], nums[[3]], nums[[4]], nums[[5]], nums[[6]], nums[[7]], nums[[8]], nums[[9]], canonicalMode];
                  strRes = ToString[NumberForm[res, 17, ExponentFunction -> (Null &)]];
                  WriteString[streamOut, line, ",", strRes, "\n"];
              ];
              line = ReadLine[streamIn];
          ];
          Close[streamIn];
          Close[streamOut];
          EOF

      - name: 🚀 Run Canonical test cases in Wolfram Language
        uses: miRoox/wolfram-action@master
        with:
          file: driver.wl
          args: test-cases.csv calc-canonical.csv
        env:
          WOLFRAM_ID: ${{ secrets.WOLFRAM_ID }}
          WOLFRAM_PASS: ${{ secrets.WOLFRAM_PASS }}

      - name: 🚀 Run Simplified test cases in Wolfram Language
        uses: miRoox/wolfram-action@master
        with:
          file: driver.wl
          args: test-cases.csv calc-simplified.csv
        env:
          WOLFRAM_ID: ${{ secrets.WOLFRAM_ID }}
          WOLFRAM_PASS: ${{ secrets.WOLFRAM_PASS }}

      - name: 🔬 Verify results with C program
        run: |
          ./ciede2000-native -i calc-canonical.csv -o summary-canonical.txt &
          ./ciede2000-native -i calc-simplified.csv -o summary-simplified.txt &
          wait
          echo "Temporary File Details:"
          du -h calc-*
          wc -l calc-*
          rm calc-*

      - name: 🏁 Conclusion
        run: |
          for compliance in simplified canonical; do
            file="summary-$compliance.txt"
            cat "$file"
            
            if [ "${file%canonical.txt}" = "$file" ]; then
              Q1="[ ] CANONICAL [X] SIMPLIFIED"
            else
              Q1="[X] CANONICAL [ ] SIMPLIFIED"
            fi
            
            if grep -Fq "$Q1" "$file" && grep -Fq "Error : 0" "$file" && grep -Fq "Successes : $n_csv_lines" "$file"; then
              echo "✔️ Verification of $file successful: all $n_csv_lines color differences were correctly calculated."
            else
              echo "❌ Verification failed. See above for details."
              exit 1
            fi
          done
